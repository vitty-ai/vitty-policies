<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vitty.ai Policies</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18201b;
        --muted: #5f6d64;
        --line: #d9e1dc;
        --panel: #f7faf8;
        --accent: #226b52;
        --page: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        margin: 0 auto;
        padding: 64px 20px;
        width: min(760px, 100%);
      }

      .eyebrow {
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 0 0 10px;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.25rem, 6vw, 4rem);
        line-height: 1.04;
        margin: 0 0 14px;
      }

      p {
        color: var(--muted);
        margin: 0 0 24px;
      }

      nav {
        display: grid;
        gap: 12px;
      }

      a {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        display: block;
        font-weight: 700;
        padding: 16px 18px;
        text-decoration: none;
      }

      a:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Vitty.ai</p>
      <h1>Policies</h1>
      <p>Official policy pages for Vitty.ai.</p>
      <nav aria-label="Policy pages">
        <a href="terms-of-service.html">Terms of Service</a>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="user-data-deletion.html">User Data Deletion Instructions</a>
      </nav>
    </main>
  </body>
</html>
